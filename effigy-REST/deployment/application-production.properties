# Production Configuration for Server "base"
# Server Configuration
server.port=443

# HTTPS Configuration
server.ssl.enabled=true
server.ssl.key-store=keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Additional HTTP port for health checks/load balancer
management.server.port=8080

# Logging Configuration
logging.level.root=DEBUG
logging.level.com.effigy=DEBUG
logging.file.name=logs/effigy-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Production optimizations
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.connection-timeout=20000

# Security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# JVM settings (reference for deployment)
# -Xms512m -Xmx2g -XX:+UseG1GC -XX:G1HeapRegionSize=16m